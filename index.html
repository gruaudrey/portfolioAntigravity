    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .bg-gradient-primary {
            background: linear-gradient(135deg, #a78bfa 0%, #94a3b8 100%);
        }
        .text-gradient-primary {
            background: linear-gradient(135deg, #a78bfa 0%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Motif numérique discret en mauve et gris */
        .bg-dot-pattern {
            background-image: radial-gradient(#e2e8f0 0.8px, transparent 0.8px);
            background-size: 24px 24px;
        }
        .bg-neural-grid {
            background-image: linear-gradient(to right, #f1f5f9 1px, transparent 1px),
                              linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .bg-mesh {
            background-color: #ffffff;
            background-image: 
                radial-gradient(at 0% 0%, hsla(270,100%,98%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(210,20%,97%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(270,100%,98%,1) 0, transparent 50%);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
        }
        @keyframes slow-pan {
          0% { background-position: 0% 0%; }
          100% { background-position: 100% 100%; }
        }
        .animate-slow-pan {
          animation: slow-pan 60s linear infinite;
        }
    </style>
